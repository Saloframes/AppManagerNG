# SPDX-License-Identifier: GPL-3.0-or-later
# Builds a SIGNED release APK and uploads it as a downloadable workflow artifact,
# so a release build can be grabbed straight from a pull request (or on demand)
# without cutting a vX.Y.Z tag.
#
# This is intentionally separate from release.yml (which is the canonical,
# tag-triggered, reproducible, attested publish path). This workflow is a
# convenience "give me the APK from this PR" build.
#
# Trigger:
#   * Manually via the Actions tab (workflow_dispatch), choosing the flavor.
#   * Automatically when a pull request is given the `build-apk` label
#     (re-runs on pushes while the label is present).
#
# Signing:
#   * If the release signing secrets are configured (same set used by
#     release.yml), the APK is signed with the real release key.
#   * Otherwise (e.g. fork PRs with no secret access) the workflow generates an
#     ephemeral keystore so the artifact is still a valid, installable, signed
#     APK. Such builds are clearly NOT signed with the official release key and
#     must not be published as releases.
name: PR Release APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Product flavor to build'
        type: choice
        default: floss
        options:
          - floss
          - full
  pull_request:
    types: [labeled, synchronize, reopened]
    branches:
      - main
      - master
      - 'AppManager-*'

permissions:
  contents: read

concurrency:
  group: pr-release-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build signed release APK
    # Manual dispatch always runs; PR runs only when the `build-apk` label is present.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'build-apk'))
    runs-on: ubuntu-latest
    env:
      FLAVOR: ${{ github.event.inputs.flavor || 'floss' }}
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build toolchain
        run: |
          NDK_VERSION="$(sed -n "s/.*ndk_version[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" versions.gradle)"
          BUILD_TOOLS="$(sed -n "s/.*build_tools[[:space:]]*=[[:space:]]*'\([^']*\)'.*/\1/p" versions.gradle)"
          echo "Installing NDK $NDK_VERSION, build-tools $BUILD_TOOLS, cmake"
          yes | sdkmanager "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS}" "cmake;3.22.1" >/dev/null

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Configure signing
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "Using configured release signing key."
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/release.jks
            STORE_PASSWORD="$SIGNING_STORE_PASSWORD"
            KEY_ALIAS="$SIGNING_KEY_ALIAS"
            KEY_PASSWORD="$SIGNING_KEY_PASSWORD"
            echo "SIGNED_WITH_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No release signing secrets configured; generating an ephemeral CI key."
            echo "::warning::The resulting APK is NOT signed with the official release key."
            STORE_PASSWORD="ci_ephemeral_$(date +%s)"
            KEY_ALIAS="ci"
            KEY_PASSWORD="$STORE_PASSWORD"
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AppManagerNG CI (ephemeral), OU=CI, O=AppManagerNG, C=NA"
            echo "SIGNED_WITH_RELEASE_KEY=false" >> "$GITHUB_ENV"
          fi
          cat > app/keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build signed release APK
        run: |
          set -euo pipefail
          FLAVOR_CAP="$(printf '%s' "${FLAVOR^}")"
          # Dependency verification is relaxed to LENIENT here only because the committed
          # gradle/verification-metadata.xml currently lags behind the resolved aapt2 build
          # tooling; this convenience build should not hard-fail on that drift.
          ./gradlew --no-daemon --stacktrace --dependency-verification lenient \
            ":app:assemble${FLAVOR_CAP}Release"

      - name: Collect APK artifacts
        id: collect
        run: |
          set -euo pipefail
          OUT_DIR="dist"
          mkdir -p "$OUT_DIR"
          VERSION_NAME="$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n1)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          shopt -s nullglob
          COUNT=0
          for SRC in app/build/outputs/apk/"${FLAVOR}"/release/*.apk; do
            BASE="$(basename "$SRC" .apk)"
            DEST="$OUT_DIR/AppManagerNG-${VERSION_NAME}-${BASE#app-}-${SHORT_SHA}.apk"
            cp "$SRC" "$DEST"
            sha256sum "$DEST" | awk -v n="$(basename "$DEST")" '{print $1"  "n}' > "${DEST}.sha256"
            COUNT=$((COUNT + 1))
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No APK produced under app/build/outputs/apk/${FLAVOR}/release" >&2
            exit 1
          fi
          echo "ARTIFACT_NAME=AppManagerNG-${FLAVOR}-release-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release APK"
            echo ""
            echo "- Flavor: \`${FLAVOR}\`"
            echo "- Version: \`${VERSION_NAME}\`"
            echo "- Signed with official release key: \`${SIGNED_WITH_RELEASE_KEY}\`"
            echo ""
            echo "Download from the **Artifacts** section of this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.ARTIFACT_NAME }}
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 30
